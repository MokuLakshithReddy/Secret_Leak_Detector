name: Publish VS Code Extension & NPM Package

on:
  release:
    types: [published]
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/publish.yml

permissions:
  contents: read

jobs:
  build-and-verify:
    name: Build & Verify (Clean Environment)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm ci

      - name: Build Scanner & CLI
        run: npm run build

      - name: Verify dist/ matches src/
        run: git diff --exit-code dist/

      - name: Lint and Test Gate
        run: |
          set -eo pipefail
          npm run lint
          npm test
          npm run test:git-hook
          npm run test:manifest
          npm run benchmark:gate

      - name: Verify npm tarball contents
        run: npm run verify:package

      - name: Package Extension & NPM Tarball
        run: |
          npm run package
          npm pack

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: release-artifacts
          path: |
            *.vsix
            *.tgz
          retention-days: 1

  publish:
    name: Publish Configured Registries
    needs: build-and-verify
    runs-on: ubuntu-latest
    environment: release
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Download Release Artifacts
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: release-artifacts

      # Determine token availability without putting secret values in job outputs.
      # Step-level env values cannot safely be used in the same step's if expression,
      # so publish steps consume only these non-secret boolean outputs.
      - name: Detect configured registry tokens
        id: registry_tokens
        shell: bash
        env:
          OVSX_TOKEN: ${{ secrets.OVSX_TOKEN }}
          VSCE_TOKEN: ${{ secrets.VSCE_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -n "$OVSX_TOKEN" ]]; then echo "ovsx=true" >> "$GITHUB_OUTPUT"; else echo "ovsx=false" >> "$GITHUB_OUTPUT"; fi
          if [[ -n "$VSCE_TOKEN" ]]; then echo "vsce=true" >> "$GITHUB_OUTPUT"; else echo "vsce=false" >> "$GITHUB_OUTPUT"; fi
          if [[ -n "$NPM_TOKEN" ]]; then echo "npm=true" >> "$GITHUB_OUTPUT"; else echo "npm=false" >> "$GITHUB_OUTPUT"; fi

      - name: Publish to Open VSX Registry
        id: publish_open_vsx
        if: steps.registry_tokens.outputs.ovsx == 'true'
        env:
          OVSX_TOKEN: ${{ secrets.OVSX_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          artifacts=( ./*.vsix )
          if [[ ${#artifacts[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one VSIX artifact; found ${#artifacts[@]}."
            exit 1
          fi
          npx ovsx publish "${artifacts[0]}" -p "$OVSX_TOKEN"

      - name: Publish to Visual Studio Marketplace
        id: publish_vs_marketplace
        if: steps.registry_tokens.outputs.vsce == 'true'
        env:
          VSCE_TOKEN: ${{ secrets.VSCE_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          artifacts=( ./*.vsix )
          if [[ ${#artifacts[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one VSIX artifact; found ${#artifacts[@]}."
            exit 1
          fi
          npx vsce publish --packagePath "${artifacts[0]}" -p "$VSCE_TOKEN"

      - name: Publish to NPM Registry
        id: publish_npm
        if: steps.registry_tokens.outputs.npm == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          artifacts=( ./*.tgz )
          if [[ ${#artifacts[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one npm tarball; found ${#artifacts[@]}."
            exit 1
          fi
          npm publish "${artifacts[0]}" --access public

      - name: Summarize registry publication
        if: always()
        shell: bash
        env:
          OVSX_CONFIGURED: ${{ steps.registry_tokens.outputs.ovsx }}
          VSCE_CONFIGURED: ${{ steps.registry_tokens.outputs.vsce }}
          NPM_CONFIGURED: ${{ steps.registry_tokens.outputs.npm }}
          OVSX_OUTCOME: ${{ steps.publish_open_vsx.outcome }}
          VSCE_OUTCOME: ${{ steps.publish_vs_marketplace.outcome }}
          NPM_OUTCOME: ${{ steps.publish_npm.outcome }}
        run: |
          set -euo pipefail
          status() {
            local configured="$1"
            local outcome="$2"
            if [[ "$configured" != "true" ]]; then
              printf 'Skipped (token not configured)'
            elif [[ "$outcome" == "success" ]]; then
              printf 'Published'
            elif [[ "$outcome" == "failure" ]]; then
              printf 'Failed'
            elif [[ "$outcome" == "skipped" ]]; then
              printf 'Not run'
            else
              printf 'Unknown'
            fi
          }
          {
            echo "## Registry publication status"
            echo
            echo "| Registry | Status |"
            echo "|---|---|"
            echo "| Open VSX | $(status "$OVSX_CONFIGURED" "$OVSX_OUTCOME") |"
            echo "| Visual Studio Marketplace | $(status "$VSCE_CONFIGURED" "$VSCE_OUTCOME") |"
            echo "| npm | $(status "$NPM_CONFIGURED" "$NPM_OUTCOME") |"
          } >> "$GITHUB_STEP_SUMMARY"
