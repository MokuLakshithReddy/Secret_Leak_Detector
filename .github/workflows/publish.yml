name: Publish VS Code Extension & NPM Package

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-verify:
    name: Build & Verify (Clean Environment)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm ci

      - name: Build Scanner & CLI
        run: npm run build

      - name: Verify dist/ matches src/
        run: git diff --exit-code dist/

      - name: Lint and Test Gate
        run: |
          set -eo pipefail
          npm run lint
          npm test
          npm run test:git-hook
          npm run test:manifest
          npm run benchmark:gate

      - name: Package Extension & NPM Tarball
        run: |
          npm run package
          npm pack

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: release-artifacts
          path: |
            *.vsix
            *.tgz
          retention-days: 1

  publish:
    name: Publish Release Artifacts
    needs: build-and-verify
    runs-on: ubuntu-latest
    environment: release
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
    # Define tokens at job scope so step-level if expressions can evaluate their presence.
    # These values are never echoed; publishing commands consume them through the environment.
    env:
      OVSX_TOKEN: ${{ secrets.OVSX_TOKEN }}
      VSCE_TOKEN: ${{ secrets.VSCE_TOKEN }}
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Download Release Artifacts
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: release-artifacts

      - name: Publish to Open VSX Registry
        id: publish_ovsx
        if: ${{ env.OVSX_TOKEN != '' }}
        run: npx ovsx publish *.vsix -p "$OVSX_TOKEN"

      - name: Publish to Visual Studio Marketplace
        id: publish_vsce
        if: ${{ env.VSCE_TOKEN != '' }}
        run: npx vsce publish --packagePath *.vsix -p "$VSCE_TOKEN"

      - name: Publish to NPM Registry
        id: publish_npm
        if: ${{ env.NODE_AUTH_TOKEN != '' }}
        run: npm publish $(ls *.tgz) --access public

      - name: Summarize registry publication
        if: always()
        env:
          OVSX_CONFIGURED: ${{ env.OVSX_TOKEN != '' }}
          VSCE_CONFIGURED: ${{ env.VSCE_TOKEN != '' }}
          NPM_CONFIGURED: ${{ env.NODE_AUTH_TOKEN != '' }}
          OVSX_OUTCOME: ${{ steps.publish_ovsx.outcome }}
          VSCE_OUTCOME: ${{ steps.publish_vsce.outcome }}
          NPM_OUTCOME: ${{ steps.publish_npm.outcome }}
        run: |
          published_count=0
          configured_count=0
          failed_count=0
          {
            echo "## Registry publication"
            for registry in OVSX VSCE NPM; do
              configured_var="${registry}_CONFIGURED"
              outcome_var="${registry}_OUTCOME"
              configured="${!configured_var}"
              outcome="${!outcome_var}"
              if [ "$configured" != "true" ]; then
                echo "- **$registry:** skipped — publishing token is not configured."
              else
                configured_count=$((configured_count + 1))
                if [ "$outcome" = "success" ]; then
                  echo "- **$registry:** published successfully."
                  published_count=$((published_count + 1))
                else
                  echo "- **$registry:** failed (step outcome: ${outcome:-unknown})."
                  failed_count=$((failed_count + 1))
                fi
              fi
            done
            echo
            echo "A successful build does not mean a registry was updated. Only entries marked published successfully confirm publication."
            if [ "$configured_count" -eq 0 ]; then
              echo
              echo "::error::No registry publishing tokens are configured. Configure at least one publishing token."
            elif [ "$failed_count" -gt 0 ]; then
              echo
              echo "::error::$failed_count configured registry publication(s) failed. Inspect the failed registry step(s)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$configured_count" -eq 0 ] || [ "$failed_count" -gt 0 ]; then
            exit 1
          fi
