name: Secret Leak Detector Security & Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security-scan:
    name: Credential Detection & Benchmark Verification
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full Git history for exposure tracing

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci

      - name: Build Scanner & CLI
        run: npm run build

      - name: Execute Security Engineering Test Suite
        run: npm test

      - name: Execute Benchmark Evaluation
        run: npm run benchmark

      - name: Enforce CI Benchmark Regression Gate (520 Fixtures)
        run: npm run benchmark:gate

      - name: Validate VS Code Extension Packaging (.vsix)
        run: npm run package

      - name: Scan Working Tree for Credentials (SARIF Export)
        run: |
          node dist/cli.js scan . --sarif --baseline .secretleak-baseline.json > secret-findings.sarif || true

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: secret-findings.sarif
          category: secret-leak-detector
