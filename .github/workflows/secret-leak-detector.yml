name: Secret Leak Detector Security & Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security-scan:
    name: Credential Detection & Benchmark Verification (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    permissions:
      contents: read
      security-events: write
      statuses: write

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # Full Git history for exposure tracing
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm ci

      - name: Type Check & Lint
        run: npm run lint

      - name: Build Scanner & CLI
        run: npm run build

      - name: Verify dist/ matches src/
        run: git diff --exit-code dist/

      - name: Execute Security Engineering Test Suite
        run: |
          set +e
          npm test > "${RUNNER_TEMP}/test-suite.log" 2>&1
          TEST_EXIT=$?
          tail -n 25 "${RUNNER_TEMP}/test-suite.log"
          if [ "$TEST_EXIT" -ne 0 ]; then
            echo "::error title=Test Suite::Test suite exited ${TEST_EXIT}."
            # Surface the failing lines as annotations so a red run is diagnosable
            # without access to the raw (authenticated) job log.
            grep -nE "FAILED|Test execution failed|AssertionError|Error:|ENOENT|EPERM|not found|Cannot find" "${RUNNER_TEMP}/test-suite.log" \
              | tail -n 20 \
              | while IFS= read -r line; do echo "::error title=Test Detail::${line}"; done
            exit 1
          fi

      - name: Execute Git Hook Integration Tests
        run: npm run test:git-hook

      - name: Execute VS Code Manifest & UI Tests
        run: npm run test:manifest

      - name: Execute VS Code Extension Host Tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:vscode

      - name: Execute VS Code Extension Host Tests (Windows & macOS)
        if: runner.os != 'Linux'
        run: npm run test:vscode

      - name: Upload Test Results Artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-suite-log-${{ matrix.os }}
          path: ${{ runner.temp }}/test-suite.log
          retention-days: 30

      - name: Clean VS Code Test Cache
        if: always()
        run: rm -rf .vscode-test

      - name: Execute Benchmark Evaluation
        run: npm run benchmark

      - name: Enforce CI Benchmark Regression Gate (520 Fixtures)
        run: npm run benchmark:gate

      - name: Run Held-Out Evaluation
        shell: bash
        run: |
          set -o pipefail
          npm run benchmark:heldout 2>&1 | tee "${RUNNER_TEMP}/held-out-results.log"

      - name: Upload Held-Out Evaluation Results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: held-out-evaluation-${{ matrix.os }}
          path: ${{ runner.temp }}/held-out-results.log
          retention-days: 90

      - name: Validate VS Code Extension Packaging (.vsix)
        run: npx @vscode/vsce package --no-git-tag-version --no-dependencies --out "${RUNNER_TEMP}/extension.vsix"

      - name: Clean Runner Artifacts Before Secret Scan
        run: rm -f test-suite.log held-out-results.log *.vsix secret-findings.sarif secret-scan-err.log secret-scan-exit.txt

      - name: Scan Working Tree for Credentials (SARIF Export)
        id: scan
        continue-on-error: true
        env:
          SLD_DISALLOW_INLINE_IGNORE: '1'
          SLD_BASE_REF: ${{ github.base_ref || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || '' }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set +e
          # The blocking threshold comes from the CLI default, which is defined
          # once in src/core/policy.ts — CI, CLI, extension and the pre-commit
          # hook therefore share a single policy.
          node dist/cli.js scan . --sarif --baseline .secretleak-baseline.json > "${RUNNER_TEMP}/secret-findings.sarif" 2> "${RUNNER_TEMP}/secret-scan-err.log"
          SCAN_EXIT=$?
          # Persist the exit code in BOTH a sentinel file and a step output.
          # The gate prefers the file, which is immune to step-output plumbing.
          printf '%s\n' "$SCAN_EXIT" > "${RUNNER_TEMP}/secret-scan-exit.txt"
          printf 'scan_exit=%s\n' "$SCAN_EXIT" >> "$GITHUB_OUTPUT"
          echo "Secret scan exit code: $SCAN_EXIT"
          # Do not fail this step: valid SARIF output must be preserved and uploaded
          # even when the scan reports findings (exit != 0). Enforcement happens in
          # the dedicated "Enforce Secret Scan Security Gate" step below.
          exit 0

      - name: Upload SARIF to GitHub Code Scanning
        if: always() && runner.os == 'Linux'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ runner.temp }}/secret-findings.sarif
          category: secret-leak-detector

      - name: Enforce Secret Scan Security Gate
        id: gate
        env:
          SLD_DISALLOW_INLINE_IGNORE: '1'
          SLD_BASE_REF: ${{ github.base_ref || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || '' }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set +e

          # Prefer the sentinel file written by the scan step; it does not depend
          # on step-output plumbing. If it is missing we re-run the scan so the
          # gate ALWAYS enforces and can never silently pass.
          if [ -f "${RUNNER_TEMP}/secret-scan-exit.txt" ]; then
            SCAN_EXIT="$(tr -dc '0-9' < "${RUNNER_TEMP}/secret-scan-exit.txt")"
          else
            echo "::warning::Scan exit-code sentinel missing; re-running scan inside the gate."
            node dist/cli.js scan . --sarif --baseline .secretleak-baseline.json > "${RUNNER_TEMP}/secret-findings.sarif" 2> "${RUNNER_TEMP}/secret-scan-err.log"
            SCAN_EXIT=$?
          fi

          SARIF_RESULTS="$(grep -c '"ruleId"' "${RUNNER_TEMP}/secret-findings.sarif" 2>/dev/null || true)"
          echo "Secret scan exit code : ${SCAN_EXIT:-<empty>}"
          echo "SARIF results         : ${SARIF_RESULTS:-0}"

          if [ -s "${RUNNER_TEMP}/secret-scan-err.log" ]; then
            echo "--- secret-scan-err.log (tail) ---"
            tail -n 40 "${RUNNER_TEMP}/secret-scan-err.log"
          fi

          if [ -z "$SCAN_EXIT" ]; then
            echo "::error title=Secret Scan Gate::Scan produced no exit code; failing closed."
            exit 1
          fi
          if [ "$SCAN_EXIT" -ne 0 ]; then
            echo "::error title=Secret Scan Gate::Secret scan exited ${SCAN_EXIT}; SARIF results=${SARIF_RESULTS:-0}. See the job log for the offending findings."
            exit 1
          fi
          echo "✅ Security gate passed: no secrets at or above the fail-on threshold."

      - name: Report GitHub Commit Status
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            STATE="success"
            DESC="Build, test suite, benchmark regression gate, vsix packaging & secret scan passed"
          else
            STATE="failure"
            DESC="CI checks failed"
          fi
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d "{\"state\":\"$STATE\",\"context\":\"continuous-integration/github-actions\",\"description\":\"$DESC\",\"target_url\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"

  cross-platform-tests:
    name: Cross-Platform Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm ci

      - name: Build Scanner & CLI
        run: npm run build

      - name: Verify dist/ matches src/
        run: git diff --exit-code dist/

      - name: Execute Security Engineering Test Suite
        run: npm test

      - name: Execute Git Hook Integration Tests
        run: npm run test:git-hook

      - name: Execute VS Code Manifest & UI Tests
        run: npm run test:manifest

      - name: Execute VS Code Extension Host Tests
        run: npm run test:vscode
