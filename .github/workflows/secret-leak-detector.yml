name: Secret Leak Detector Security & Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security-scan:
    name: Credential Detection & Benchmark Verification
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write
      statuses: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full Git history for exposure tracing

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci

      - name: Build Scanner & CLI
        run: npm run build

      - name: Execute Security Engineering Test Suite
        run: npm test

      - name: Execute Benchmark Evaluation
        run: npm run benchmark

      - name: Enforce CI Benchmark Regression Gate (520 Fixtures)
        run: npm run benchmark:gate

      - name: Validate VS Code Extension Packaging (.vsix)
        run: npm run package

      - name: Scan Working Tree for Credentials (SARIF Export)
        id: scan
        continue-on-error: true
        run: |
          set +e
          node dist/cli.js scan . --sarif --baseline .secretleak-baseline.json > secret-findings.sarif 2> secret-scan-err.log
          SCAN_EXIT=$?
          echo "scan_exit=$SCAN_EXIT" >> $GITHUB_OUTPUT
          # Do not fail this step: valid SARIF output must be preserved and uploaded
          # even when the scan reports findings (exit != 0). Security enforcement is
          # performed in the dedicated "Enforce Secret Scan Security Gate" step below.
          exit 0

      - name: Upload SARIF to GitHub Code Scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: secret-findings.sarif
          category: secret-leak-detector

      - name: Enforce Secret Scan Security Gate
        id: gate
        run: |
          EXIT_CODE="${{ steps.scan.outputs.scan_exit }}"
          if [ -z "$EXIT_CODE" ]; then
            echo "❌ Security gate failed: secret scan step did not produce an exit code."
            exit 1
          fi
          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "❌ Security gate failed: secret scan exited with code $EXIT_CODE."
            if [ -f secret-scan-err.log ] && [ -s secret-scan-err.log ]; then
              echo "Scan error output:"
              cat secret-scan-err.log
            fi
            exit 1
          fi
          echo "✅ Security gate passed: no secrets at or above the fail-on threshold."

      - name: Report GitHub Commit Status
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            STATE="success"
            DESC="Extension build, test suite (79/79), regression gate & vsix packaging passed"
          else
            STATE="failure"
            DESC="CI checks failed"
          fi
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d "{\"state\":\"$STATE\",\"context\":\"continuous-integration/github-actions\",\"description\":\"$DESC\",\"target_url\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
