<text x="56" y="710" class="lab">Interpretation and scope</text>
<text x="56" y="738" class="sub">These results belong to a controlled, author-generated corpus and are not a third-party reproduction.</text>
<text x="56" y="764" class="sub">The benchmark binary was version 1.0.3; the repository now identifies the extension as 1.0.4.</text>
