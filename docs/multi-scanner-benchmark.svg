<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
<title id="title">Secret Leak Detector multi-scanner benchmark</title>
<desc id="desc">Author-reported comparison on a controlled 1000-file corpus, with precision, recall, F1, and false-positive rate for Secret Leak Detector, Gitleaks, TruffleHog, and detect-secrets.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#111827"/></linearGradient>
 <linearGradient id="main" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#2dd4bf"/></linearGradient>
 <linearGradient id="others" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#60a5fa"/><stop offset="1" stop-color="#818cf8"/></linearGradient>
 <style>
  .h{font:700 34px Inter,Segoe UI,Arial,sans-serif;fill:#f8fafc}
  .sub{font:400 16px Inter,Segoe UI,Arial,sans-serif;fill:#94a3b8}
  .panel{fill:#111c2d;stroke:#263549;stroke-width:1.5}
  .pt{font:700 20px Inter,Segoe UI,Arial,sans-serif;fill:#e2e8f0}
  .lab{font:500 14px Inter,Segoe UI,Arial,sans-serif;fill:#cbd5e1}
  .muted{font:400 12px Inter,Segoe UI,Arial,sans-serif;fill:#94a3b8}
  .value{font:700 14px Inter,Segoe UI,Arial,sans-serif;fill:#f8fafc}
  .small{font:400 11px Inter,Segoe UI,Arial,sans-serif;fill:#94a3b8}
 </style>
